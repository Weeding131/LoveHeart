<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أحبك بكل اللغات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Outfit:wght@600&display=swap">
<style>
/* Layout: a black screen like the reference video. A tap starts the song and the drawing together.
   The heart is typeset as tight justified rows of words; a pen first traces the outline clockwise
   from the top notch, then the inside fills in. Each word fades in from dim to bright red. */
:root {
  color-scheme: dark;
  --bg: #050102;
  --ink: #ffd9d4;
  --muted: #b06a70;
  --red: #ff2d2d;
  --red-soft: #ff6b5e;
  --line: #5a1519;
  --font-title: 'Aref Ruqaa', 'Amiri', serif;
  --font-ui: 'IBM Plex Sans Arabic', 'Segoe UI', system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  box-sizing: border-box;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}
#app { height: 100%; display: flex; flex-direction: column; gap: 6px; min-height: 0; }

h1 {
  margin: 0;
  text-align: center;
  font-family: var(--font-title);
  font-weight: 700;
  font-size: clamp(24px, 5vw, 34px);
  line-height: 1.3;
  color: var(--red-soft);
  text-shadow: 0 0 18px rgba(255, 45, 45, .55);
}

.stage { position: relative; flex: 1; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.start {
  position: absolute; inset: 0; margin: auto;
  width: 150px; height: 150px; border-radius: 50%;
  display: grid; place-content: center; justify-items: center; gap: 6px;
  background: transparent; color: var(--ink);
  border: 1px solid var(--red);
  box-shadow: 0 0 34px rgba(255, 45, 45, .35), inset 0 0 26px rgba(255, 45, 45, .18);
  font: 500 15px var(--font-ui);
  cursor: pointer;
  transition: opacity .6s ease, transform .6s ease;
  animation: breathe 2.4s ease-in-out infinite;
}
.start svg { width: 38px; height: 38px; fill: var(--red); filter: drop-shadow(0 0 8px rgba(255, 45, 45, .8)); }
.start:focus-visible, .btn:focus-visible { outline: 2px solid var(--red-soft); outline-offset: 4px; }
.start.gone { opacity: 0; transform: scale(1.35); pointer-events: none; animation: none; }
@keyframes breathe { 50% { transform: scale(1.06); box-shadow: 0 0 52px rgba(255, 45, 45, .5), inset 0 0 30px rgba(255, 45, 45, .24); } }

.bar { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 14px var(--font-ui);
  color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 14px; cursor: pointer;
  transition: background-color .2s ease, border-color .2s ease, transform .2s ease;
}
.btn:hover { background: #2a0a0d; border-color: var(--red); }
.btn:active { transform: scale(.97); }
.btn svg { flex: none; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .start { animation: none; transition: none; }
  .btn { transition: none; }
}
</style>

<style>
html { box-sizing: border-box; padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); background: #050102; }
body { margin: 0; }
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <h1>أحبك بكل اللغات</h1>

  <main class="stage" id="stage">
    <canvas id="c" role="img" aria-label="قلب أحمر يمتلئ بكلمة أحبك بأكثر من عشرين لغة"></canvas>
    <button class="start" id="start" type="button" aria-label="ابدأ الرسم مع الموسيقى">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.6-9.3-9C1 8.6 3 5 6.4 5c2 0 3.6 1.2 5.6 3.4C14 6.2 15.6 5 17.6 5 21 5 23 8.6 21.3 12c-2.3 4.4-9.3 9-9.3 9z"/></svg>
      <span>المس لتبدأ</span>
    </button>
  </main>

  <div class="bar">
    <button class="btn" id="sound" type="button" aria-pressed="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <span id="soundLabel">كتم الصوت</span>
    </button>
    <button class="btn" id="replay" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      <span>أعد الرسم</span>
    </button>
  </div>
  <ul class="sr" id="srList"></ul>
</div>

    words.forEach(function (w) { w.rt = w.rt / maxRt * 0.999; });
    words.sort(function (p, q) { return p.rt - q.rt; });

    lctx.clearRect(0, 0, W, H);

  }

    ctx.closePath();

  function frame(now) {

      drawWord(lctx, bw, 1, bw.a, bw.col, 0);
